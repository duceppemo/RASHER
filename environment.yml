# mamba env create -f environment.yml && conda activate RASHER && pip install .
name: RASHER
channels:
  - conda-forge
  - bioconda
dependencies:
  - python>=3.10
  - minimap2>=2.24      # baiting, templated assembly
  - samtools>=1.21      # templated assembly (samtools consensus -X hiseq)
  - fastp>=1.0          # read filtering and adapter trimming
  - skesa>=2.5          # de novo assembly (-a skesa, the recommended de novo assembler)
  - spades>=4.0         # de novo assembly (-a spades)
  - ska2>=0.5           # SNPs (--snp-method ska)
  - parsnp>=2.1.2       # SNPs (--snp-method parsnp)
  - harvesttools
  - fasttree>=2.1.11    # trees
  - iqtree>=2.2         # trees (--tree iqtree)
  - bbmap>=39           # baiting (-b bbduk)
  - bandage             # optional: pictures of the assembly graphs
  - python-isal         # optional: faster gzip decompression
  - pip
