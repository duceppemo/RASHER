[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rasher"
# Static on purpose (see mashID): tests/test_cli.py keeps this in sync with rasher.__version__.
version = "0.1.0"
description = "Bait, Assemble and Compare Illumina short reads matching a reference sequence, such as an organelle genome."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Marc-Olivier Duceppe" }]
requires-python = ">=3.10"
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

[project.optional-dependencies]
fast = ["isal>=1.0"]      # faster gzip decompression of reads
test = ["pytest>=7", "pytest-cov>=5", "ruff", "pre-commit"]

[project.urls]
Homepage = "https://github.com/duceppemo/RASHER"
Documentation = "https://github.com/duceppemo/RASHER/wiki"

[project.scripts]
rasher = "rasher.cli:main"

[tool.setuptools]
packages = ["rasher"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["tools: needs the external programs (minimap2, fastp, spades.py, ska, ...) on PATH"]

[tool.coverage.run]
source = ["rasher"]

[tool.ruff]
line-length = 115
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E731", "B905"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
